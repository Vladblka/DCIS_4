<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Все записи')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>
<div th:replace="~{fragments/common :: alerts}"></div>

<main class="container">
    <div class="page-head">
        <div>
            <h1>Все записи</h1>
            <p class="hint">Таблица музыкальных инструментов, сохранённых в базе данных.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/instruments/new}">+ Добавить запись</a>
    </div>

    <div class="card" th:if="${!#lists.isEmpty(instruments)}">
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>№</th>
                    <th>Название</th>
                    <th>Бренд</th>
                    <th>Тип</th>
                    <th>Материал</th>
                    <th class="num">Цена</th>
                    <th class="num">Кол-во</th>
                    <th class="actions-col">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${instruments}">
                    <td th:text="${item.id}">1</td>
                    <td th:text="${item.name}">Stratocaster</td>
                    <td th:text="${item.brand}">Fender</td>
                    <td th:text="${item.instrumentType}">гитара</td>
                    <td th:text="${item.material}">ольха</td>
                    <td class="num" th:text="${#numbers.formatDecimal(item.price, 1, 2)}">85 000,50</td>
                    <td class="num" th:text="${item.quantity}">3</td>
                    <td class="actions">
                        <a class="btn btn-small" th:href="@{/instruments/{id}/edit(id=${item.id})}">Изменить</a>
                        <a class="btn btn-small btn-danger" th:href="@{/instruments/{id}/delete(id=${item.id})}">Удалить</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card empty" th:if="${#lists.isEmpty(instruments)}">
        <p>Записей пока нет.</p>
        <a class="btn btn-primary" th:href="@{/instruments/new}">Добавить первую запись</a>
    </div>
</main>

</body>
</html>
