<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Главная')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<main class="container">
    <h1>Учёт музыкальных инструментов</h1>
    <p class="hint">Добро пожаловать! Выберите нужный раздел.</p>

    <div class="cards">
        <a class="card card-link" th:href="@{/instruments}">
            <h2>Все записи</h2>
        </a>
        <a class="card card-link" th:href="@{/instruments/new}">
            <h2>Добавить запись</h2>
        </a>
        <a class="card card-link" th:href="@{/instruments/edit}">
            <h2>Изменить запись</h2>
        </a>
        <a class="card card-link" th:href="@{/instruments/delete}">
            <h2>Удалить запись</h2>
        </a>
        <a class="card card-link" th:href="@{/instruments/search}">
            <h2>Поиск по бренду</h2>
        </a>
    </div>
</main>

</body>
</html>
